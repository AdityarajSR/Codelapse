<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Codelapse — watch your code run">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a7cff"/>
      <stop offset="1" stop-color="#33d6f5"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a7cff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#8a7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#33d6f5" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#33d6f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="35%" r="75%">
      <stop offset="35%" stop-color="#000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1280" height="420" fill="url(#fade)"/></mask>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="#07070c"/>
  <rect width="1280" height="420" fill="url(#dots)" mask="url(#dotmask)"/>
  <circle cx="250" cy="120" r="360" fill="url(#orbA)"/>
  <circle cx="1050" cy="330" r="380" fill="url(#orbB)"/>

  <!-- brand mark -->
  <g transform="translate(566, 96)">
    <rect width="72" height="72" rx="18" fill="url(#brand)"/>
    <path d="M26.5 22v28c0 2 2.2 3.2 3.9 2.1l22-14a2.5 2.5 0 0 0 0-4.2l-22-14c-1.7-1.1-3.9.1-3.9 2.1z" fill="#07070c"/>
  </g>

  <text x="640" y="238" text-anchor="middle" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="#f1f1f8">Code</tspan><tspan fill="url(#brand)">lapse</tspan>
  </text>

  <text x="640" y="288" text-anchor="middle" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#a3a4c0">
    Watch your code run — line by line, in 3D.
  </text>

  <g font-family="'JetBrains Mono', ui-monospace, 'Consolas', monospace" font-size="14" fill="#8a8ba8" text-anchor="middle">
    <text x="640" y="340">Python + JavaScript&#160;&#160;·&#160;&#160;in your browser&#160;&#160;·&#160;&#160;3D data-structure stage&#160;&#160;·&#160;&#160;shareable runs</text>
  </g>

  <rect x="490" y="366" width="300" height="3" rx="1.5" fill="url(#brand)" opacity="0.8"/>
</svg>
